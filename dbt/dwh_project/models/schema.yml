  - name: loan_contract_intf
    description: Interface hợp đồng vay (L1)
    meta:
      owner: ducnm
      created_date: 2026-10-02
    config:
      tags: ["cbd", "intf", "loan_contract_intf"]
      materialized: incremental
      incremental_strategy: append
      on_schema_change: fail
      database: "{{ var('src_bu_intf_db') }}"
      schema: dwh_intf
    tests:
      - unique_value:
          column_name: "contract_nbr"
          filter_column: "business_date"
      - not_null_value:
          column_name: "contract_nbr"
          filter_column: "business_date"
      - count_gte_zero:
          filter_column: "business_date"

  - name: bi_lend_repay_info_intf__fa
    description: Interface thông tin trả nợ vay của khối BI (layer 2, fact append)
    meta:
      owner: ducnm
      created_date: 2026-10-02
    config:
      tags: ["intf_layer_2", "bi_intf", "bi", "bi_lend_repay_info_intf__fa"]
      materialized: incremental
      incremental_strategy: append
      on_schema_change: fail
      database: "{{ var('src_data_prod_db_bi') }}"
      schema: bi_intf
    tests:
      - unique_value:
          column_name: "(REPAY_ACTY_CODE||'-'||BUSINESS_DATE)"
          filter_column: "tf_partition_date"

  # ===== Case 04_card - Thẻ (training/cases/04_card/dbt/schema.yml)

  - name: stg_card_intf_way4__snp
