      incremental_strategy: append
      on_schema_change: fail
      database: "{{ var('src_bu_intf_db') }}"
      schema: dwh_intf
    tests:
      - unique_value:
          column_name: (REPAY_ACTY_CODE)
          filter_column: "BUSINESS_DATE"

  - name: stg_ar_x_cl_pst_t24_loan__snp
    description: Staging tập hợp đồng vay T24 LD của LOAN_CONTRACT_INTF
    meta:
      owner: ducnm
      created_date: 2026-10-02
    config:
      tags: ["cbd", "stag", "loan_contract_intf", "src_ld_for_loan_contract_intf"]
